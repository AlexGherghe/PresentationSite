<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 600" width="1480" height="600">
<metadata></metadata>
<defs>
<style class="style-fonts">
@font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }
</style>
</defs>
<rect x="0" y="0" width="1480" height="600" fill="#ffffff"></rect>

<!-- HEAD Node -->
<g transform="translate(40 100)">
    <rect x="0" y="0" width="180" height="80" rx="8" stroke="#9c36b5" stroke-width="3" fill="#f3d9fa"></rect>
    <text x="90" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#9c36b5" text-anchor="middle" dominant-baseline="central">HEAD</text>
    <text x="90" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="14px" fill="#9c36b5" text-anchor="middle" dominant-baseline="central">ref: refs/heads/main</text>
</g>

<!-- Arrow HEAD -> Branch -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(130 180)">
    <path d="M0 0 L0 70 L-8 55 M0 70 L8 55" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Branch Node -->
<g transform="translate(40 250)">
    <rect x="0" y="0" width="180" height="80" rx="8" stroke="#9c36b5" stroke-width="3" fill="#f3d9fa"></rect>
    <text x="90" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#9c36b5" text-anchor="middle" dominant-baseline="central">Branch: main</text>
    <text x="90" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="14px" fill="#9c36b5" text-anchor="middle" dominant-baseline="central">8a2f3...</text>
</g>

<!-- Arrow Branch -> Commit 2 -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(220 290)">
    <path d="M0 0 L80 0 L65 -8 M80 0 L65 8" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Commit 2 Node (Current) -->
<g transform="translate(300 220)">
    <rect x="0" y="0" width="220" height="140" rx="8" stroke="#e03131" stroke-width="3" fill="#ffe3e3"></rect>
    <text x="110" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#e03131" text-anchor="middle" dominant-baseline="central">Commit</text>
    <text x="110" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#e03131" text-anchor="middle" dominant-baseline="central">tree 5c3a...</text>
    <text x="110" y="90" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#e03131" text-anchor="middle" dominant-baseline="central">parent 9b1e...</text>
    <text x="110" y="120" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#e03131" text-anchor="middle" dominant-baseline="central">author AlexGherghe</text>
</g>

<!-- Arrow Commit 2 -> Commit 1 (Parent) -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(410 360)">
    <path d="M0 0 L0 70 L-8 55 M0 70 L8 55" stroke="#868e96" stroke-width="3" fill="none"></path>
    <text x="35" y="35" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#868e96" text-anchor="middle">parent</text>
</g>

<!-- Commit 1 Node (Parent) -->
<g transform="translate(300 430)">
    <rect x="0" y="0" width="220" height="110" rx="8" stroke="#e03131" stroke-width="3" fill="#ffe3e3"></rect>
    <text x="110" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#e03131" text-anchor="middle" dominant-baseline="central">Commit (Parent)</text>
    <text x="110" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#e03131" text-anchor="middle" dominant-baseline="central">tree 2d8f...</text>
    <text x="110" y="90" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#e03131" text-anchor="middle" dominant-baseline="central">author AlexGherghe</text>
</g>

<!-- Arrow Commit 2 -> Tree -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(520 280)">
    <path d="M0 0 L80 0 L65 -8 M80 0 L65 8" stroke="#868e96" stroke-width="3" fill="none"></path>
    <text x="40" y="-15" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#868e96" text-anchor="middle">tree</text>
</g>

<!-- Tree Node (Root) -->
<g transform="translate(600 220)">
    <rect x="0" y="0" width="240" height="120" rx="8" stroke="#2f9e44" stroke-width="3" fill="#ebfbee"></rect>
    <text x="120" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">Tree</text>
    <text x="120" y="70" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">blob 7e1b... file.txt</text>
    <text x="120" y="100" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">tree a4f3... src/</text>
</g>

<!-- Arrow Tree -> Blob 1 -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(840 290)">
    <path d="M0 0 L80 -130 L65 -125 M80 -130 L75 -115" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Arrow Tree -> Tree (src) -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(840 320)">
    <path d="M0 0 L80 0 L65 -8 M80 0 L65 8" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Blob 1 Node -->
<g transform="translate(920 110)">
    <rect x="0" y="0" width="200" height="100" rx="8" stroke="#1971c2" stroke-width="3" fill="#e7f5ff"></rect>
    <text x="100" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">Blob</text>
    <text x="100" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">7e1b...</text>
    <text x="100" y="85" font-family="Excalifont, Xiaolai, sans-serif" font-size="14px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">"Hello World"</text>
</g>

<!-- Tree Node (src/) -->
<g transform="translate(920 260)">
    <rect x="0" y="0" width="240" height="120" rx="8" stroke="#2f9e44" stroke-width="3" fill="#ebfbee"></rect>
    <text x="120" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">Tree (src/)</text>
    <text x="120" y="70" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">blob 3c2d... main.c</text>
    <text x="120" y="100" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#2f9e44" text-anchor="middle" dominant-baseline="central">blob 8f4e... README.md</text>
</g>

<!-- Arrow Tree (src) -> Blob 2 -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(1160 330)">
    <path d="M0 0 L80 -130 L65 -125 M80 -130 L75 -115" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Arrow Tree (src) -> Blob 3 -->
<g stroke-linecap="round" stroke-linejoin="round" transform="translate(1160 360)">
    <path d="M0 0 L80 50 L65 42 M80 50 L75 35" stroke="#868e96" stroke-width="3" fill="none"></path>
</g>

<!-- Blob 2 Node -->
<g transform="translate(1240 150)">
    <rect x="0" y="0" width="200" height="100" rx="8" stroke="#1971c2" stroke-width="3" fill="#e7f5ff"></rect>
    <text x="100" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">Blob</text>
    <text x="100" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">3c2d...</text>
    <text x="100" y="85" font-family="Excalifont, Xiaolai, sans-serif" font-size="14px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">int main() {...}</text>
</g>

<!-- Blob 3 Node -->
<g transform="translate(1240 360)">
    <rect x="0" y="0" width="200" height="100" rx="8" stroke="#1971c2" stroke-width="3" fill="#e7f5ff"></rect>
    <text x="100" y="30" font-family="Excalifont, Xiaolai, sans-serif" font-size="24px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">Blob</text>
    <text x="100" y="60" font-family="Excalifont, Xiaolai, sans-serif" font-size="16px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">8f4e...</text>
    <text x="100" y="85" font-family="Excalifont, Xiaolai, sans-serif" font-size="14px" fill="#1971c2" text-anchor="middle" dominant-baseline="central">"# Welcome to Git"</text>
</g>

</svg>
