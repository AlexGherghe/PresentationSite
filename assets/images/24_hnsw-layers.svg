<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8590c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" rx="16" fill="#fafafa"/>

  <!-- Title -->
  <text x="295" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">HNSW Multi-Layer Graph Structure</text>

  <!-- ===== LAYER 3 (Top — most sparse) ===== -->
  <rect x="30" y="65" width="530" height="105" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="55" y="92" font-size="14" font-weight="700" fill="#92400e">Layer 3</text>
  <text x="55" y="110" font-size="11" fill="#92400e">(sparse — "intercontinental flights")</text>

  <!-- Nodes layer 3 -->
  <circle cx="155" cy="130" r="16" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="155" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text>

  <circle cx="430" cy="130" r="16" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text>

  <!-- Links layer 3 -->
  <line x1="171" y1="130" x2="414" y2="130" stroke="#d97706" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- ===== LAYER 2 ===== -->
  <rect x="30" y="190" width="530" height="105" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="55" y="217" font-size="14" font-weight="700" fill="#0369a1">Layer 2</text>
  <text x="55" y="235" font-size="11" fill="#0369a1">(moderate density)</text>

  <!-- Nodes layer 2 -->
  <circle cx="155" cy="255" r="16" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <text x="155" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text>

  <circle cx="295" cy="255" r="16" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <text x="295" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">F</text>

  <circle cx="430" cy="255" r="16" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  <text x="430" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text>

  <!-- Links layer 2 -->
  <line x1="171" y1="255" x2="279" y2="255" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="311" y1="255" x2="414" y2="255" stroke="#0284c7" stroke-width="1.5"/>

  <!-- ===== LAYER 1 ===== -->
  <rect x="30" y="315" width="530" height="105" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="55" y="342" font-size="14" font-weight="700" fill="#166534">Layer 1</text>
  <text x="55" y="360" font-size="11" fill="#166534">(denser)</text>

  <!-- Nodes layer 1 -->
  <circle cx="155" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text>

  <circle cx="225" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">C</text>

  <circle cx="295" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="295" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">F</text>

  <circle cx="365" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">J</text>

  <circle cx="430" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text>

  <circle cx="500" cy="380" r="16" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">P</text>

  <!-- Links layer 1 -->
  <line x1="171" y1="380" x2="209" y2="380" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="241" y1="380" x2="279" y2="380" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="311" y1="380" x2="349" y2="380" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="381" y1="380" x2="414" y2="380" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="446" y1="380" x2="484" y2="380" stroke="#16a34a" stroke-width="1.5"/>

  <!-- ===== LAYER 0 (Bottom — all nodes) ===== -->
  <rect x="30" y="440" width="530" height="110" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="55" y="467" font-size="14" font-weight="700" fill="#6b21a8">Layer 0</text>
  <text x="55" y="485" font-size="11" fill="#6b21a8">(all nodes — "local roads")</text>

  <!-- Nodes layer 0 -->
  <circle cx="120" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="120" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">A</text>

  <circle cx="158" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="158" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">B</text>

  <circle cx="196" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="196" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">C</text>

  <circle cx="234" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="234" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">D</text>

  <circle cx="272" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="272" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">E</text>

  <circle cx="310" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="310" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">F</text>

  <circle cx="348" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="348" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">G</text>

  <circle cx="386" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="386" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">H</text>

  <circle cx="424" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="424" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">J</text>

  <circle cx="462" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="462" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">K</text>

  <circle cx="500" cy="510" r="13" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  <text x="500" y="515" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">M</text>

  <!-- Links layer 0 (local connections) -->
  <line x1="133" y1="510" x2="145" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="171" y1="510" x2="183" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="209" y1="510" x2="221" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="247" y1="510" x2="259" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="285" y1="510" x2="297" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="323" y1="510" x2="335" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="361" y1="510" x2="373" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="399" y1="510" x2="411" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="437" y1="510" x2="449" y2="510" stroke="#9333ea" stroke-width="1"/>
  <line x1="475" y1="510" x2="487" y2="510" stroke="#9333ea" stroke-width="1"/>
  <!-- Some cross-links in layer 0 -->
  <line x1="133" y1="504" x2="183" y2="504" stroke="#9333ea" stroke-width="0.8" opacity="0.4"/>
  <line x1="247" y1="504" x2="297" y2="504" stroke="#9333ea" stroke-width="0.8" opacity="0.4"/>
  <line x1="399" y1="504" x2="449" y2="504" stroke="#9333ea" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== Vertical connectors (showing same node across layers) ===== -->
  <line x1="155" y1="146" x2="155" y2="239" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="155" y1="271" x2="155" y2="364" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="120" y1="396" x2="120" y2="497" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <line x1="430" y1="146" x2="430" y2="239" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="430" y1="271" x2="430" y2="364" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="500" y1="396" x2="500" y2="497" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <line x1="295" y1="271" x2="295" y2="364" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="310" y1="396" x2="310" y2="497" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- ===== SEARCH PATH (highlighted in orange) ===== -->
  <rect x="600" y="65" width="270" height="490" rx="14" fill="#fff" stroke="#e8590c" stroke-width="2"/>
  <text x="735" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#e8590c">Search Path</text>
  <text x="735" y="116" text-anchor="middle" font-size="11" fill="#94a3b8">Query: find nearest to Q</text>

  <!-- Search step 1: Layer 3 -->
  <text x="735" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">Layer 3</text>
  <circle cx="670" cy="172" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  <line x1="684" y1="172" x2="786" y2="172" stroke="#e8590c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <circle cx="800" cy="172" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">M</text>

  <!-- Arrow down -->
  <line x1="800" y1="188" x2="800" y2="218" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrOrange)" stroke-dasharray="5 3"/>
  <text x="820" y="210" font-size="10" fill="#e8590c">↓ descend</text>

  <!-- Search step 2: Layer 2 -->
  <text x="735" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">Layer 2</text>
  <circle cx="800" cy="262" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">M</text>
  <line x1="786" y1="262" x2="684" y2="262" stroke="#e8590c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <circle cx="670" cy="262" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">F</text>

  <!-- Arrow down -->
  <line x1="670" y1="278" x2="670" y2="308" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrOrange)" stroke-dasharray="5 3"/>
  <text x="690" y="300" font-size="10" fill="#e8590c">↓ descend</text>

  <!-- Search step 3: Layer 1 -->
  <text x="735" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">Layer 1</text>
  <circle cx="670" cy="352" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">F</text>
  <line x1="684" y1="352" x2="786" y2="352" stroke="#e8590c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <circle cx="800" cy="352" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">J</text>

  <!-- Arrow down -->
  <line x1="800" y1="368" x2="800" y2="398" stroke="#e8590c" stroke-width="1.5" marker-end="url(#arrOrange)" stroke-dasharray="5 3"/>
  <text x="820" y="390" font-size="10" fill="#e8590c">↓ descend</text>

  <!-- Search step 4: Layer 0 -->
  <text x="735" y="422" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">Layer 0</text>
  <circle cx="800" cy="442" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="447" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">J</text>
  <line x1="786" y1="442" x2="684" y2="442" stroke="#e8590c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <circle cx="670" cy="442" r="14" fill="#e8590c" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="447" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">H</text>

  <!-- Result -->
  <rect x="660" y="478" width="150" height="52" rx="10" fill="#fff7ed" stroke="#e8590c" stroke-width="2"/>
  <text x="735" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">✓ Nearest: H</text>
  <text x="735" y="518" text-anchor="middle" font-size="10" fill="#94a3b8">4 hops total</text>

  <!-- Bottom legend -->
  <rect x="30" y="572" width="840" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="65" y="600" font-size="12" font-weight="700" fill="#334155">Key insight:</text>
  <text x="65" y="620" font-size="12" fill="#64748b">Top layers = sparse, long-range hops (skip over large regions)</text>
  <text x="65" y="638" font-size="12" fill="#64748b">Bottom layer = dense, short-range links (fine-grained precision)</text>

  <text x="540" y="600" font-size="12" font-weight="700" fill="#334155">Complexity:</text>
  <text x="540" y="620" font-size="12" fill="#64748b">Searched 4 nodes out of 13 total</text>
  <text x="540" y="638" font-size="12" font-weight="700" fill="#e8590c">O(log N) search time</text>
</svg>
