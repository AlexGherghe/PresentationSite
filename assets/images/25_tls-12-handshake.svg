<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e1e1e; }
      .actor { font-size: 20px; font-weight: 600; }
      .msg { font-size: 17px; font-weight: 600; }
      .sub { font-size: 14px; fill: #666; }
      .note { font-size: 14px; }
      .rtt { font-size: 15px; font-weight: 600; fill: #c92a2a; }
      .data { font-size: 16px; font-weight: 600; fill: #2b8a3e; }
      .lifeline { stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .call { stroke: #1e1e1e; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1040" height="660" fill="#fff"/>

  <!-- Actors -->
  <rect x="200" y="20" width="160" height="50" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
  <text x="280" y="52" text-anchor="middle" class="actor">Client</text>
  <rect x="760" y="20" width="160" height="50" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
  <text x="840" y="52" text-anchor="middle" class="actor">Server</text>

  <line x1="280" y1="70" x2="280" y2="630" class="lifeline"/>
  <line x1="840" y1="70" x2="840" y2="630" class="lifeline"/>

  <!-- Round trip 1 -->
  <text x="560" y="104" text-anchor="middle" class="msg">ClientHello</text>
  <text x="560" y="124" text-anchor="middle" class="sub">TLS versions, cipher suites, client random</text>
  <line x1="280" y1="138" x2="838" y2="138" class="call" marker-end="url(#arrow)"/>

  <text x="560" y="200" text-anchor="middle"><tspan class="msg">ServerHello</tspan><tspan class="sub" dx="8">chosen cipher suite, server random</tspan></text>
  <text x="560" y="224" text-anchor="middle"><tspan class="msg">Certificate</tspan><tspan class="sub" dx="8">contains the server's public key</tspan></text>
  <text x="560" y="248" text-anchor="middle"><tspan class="msg">ServerHelloDone</tspan></text>
  <line x1="840" y1="264" x2="282" y2="264" class="call" marker-end="url(#arrow)"/>

  <rect x="100" y="284" width="360" height="52" rx="6" fill="#EDF2AE" stroke="#666" stroke-width="1.5"/>
  <text x="280" y="306" text-anchor="middle" class="note">Verifies certificate, makes up a secret,</text>
  <text x="280" y="325" text-anchor="middle" class="note">encrypts it with the server's public key</text>

  <!-- Round trip 2 -->
  <text x="560" y="368" text-anchor="middle"><tspan class="msg">ClientKeyExchange</tspan><tspan class="sub" dx="8">the encrypted secret</tspan></text>
  <text x="560" y="392" text-anchor="middle"><tspan class="msg">ChangeCipherSpec</tspan><tspan class="sub" dx="8">"encrypting from now on"</tspan></text>
  <text x="560" y="416" text-anchor="middle"><tspan class="msg">Finished</tspan><tspan class="sub" dx="8">hash of the handshake (encrypted)</tspan></text>
  <line x1="280" y1="432" x2="838" y2="432" class="call" marker-end="url(#arrow)"/>

  <rect x="660" y="452" width="360" height="52" rx="6" fill="#EDF2AE" stroke="#666" stroke-width="1.5"/>
  <text x="840" y="474" text-anchor="middle" class="note">Decrypts the secret with its private key,</text>
  <text x="840" y="493" text-anchor="middle" class="note">derives the session keys</text>

  <text x="560" y="528" text-anchor="middle"><tspan class="msg">ChangeCipherSpec</tspan></text>
  <text x="560" y="552" text-anchor="middle"><tspan class="msg">Finished</tspan><tspan class="sub" dx="8">(encrypted)</tspan></text>
  <line x1="840" y1="568" x2="282" y2="568" class="call" marker-end="url(#arrow)"/>

  <!-- Application data -->
  <text x="560" y="598" text-anchor="middle" class="data">Application data (HTTP), encrypted</text>
  <line x1="284" y1="614" x2="836" y2="614" stroke="#2b8a3e" stroke-width="3" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>

  <!-- RTT brackets -->
  <path d="M90,138 H74 V264 H90" stroke="#c92a2a" stroke-width="2" fill="none"/>
  <text transform="translate(60 201) rotate(-90)" text-anchor="middle" class="rtt">Round trip 1</text>
  <path d="M90,432 H74 V568 H90" stroke="#c92a2a" stroke-width="2" fill="none"/>
  <text transform="translate(60 500) rotate(-90)" text-anchor="middle" class="rtt">Round trip 2</text>
</svg>
