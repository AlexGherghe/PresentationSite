<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e1e1e; }
      .actor { font-size: 20px; font-weight: 600; }
      .msg { font-size: 17px; font-weight: 600; }
      .sub { font-size: 14px; fill: #666; }
      .key { font-size: 14px; font-weight: 600; fill: #5f3dc4; }
      .note { font-size: 14px; }
      .rtt { font-size: 15px; font-weight: 600; fill: #c92a2a; }
      .data { font-size: 16px; font-weight: 600; fill: #2b8a3e; }
      .tag { font-size: 13px; font-weight: 600; fill: #2b8a3e; }
      .lifeline { stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .call { stroke: #1e1e1e; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1040" height="600" fill="#fff"/>

  <!-- Actors -->
  <rect x="200" y="20" width="160" height="50" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
  <text x="280" y="52" text-anchor="middle" class="actor">Client</text>
  <rect x="760" y="20" width="160" height="50" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
  <text x="840" y="52" text-anchor="middle" class="actor">Server</text>

  <line x1="280" y1="70" x2="280" y2="580" class="lifeline"/>
  <line x1="840" y1="70" x2="840" y2="580" class="lifeline"/>

  <!-- Client flight -->
  <text x="560" y="100" text-anchor="middle" class="msg">ClientHello</text>
  <text x="560" y="120" text-anchor="middle" class="sub">TLS versions, cipher suites, client random</text>
  <text x="560" y="140" text-anchor="middle" class="key">+ key share: client's half of the Diffie-Hellman exchange</text>
  <line x1="280" y1="156" x2="838" y2="156" class="call" marker-end="url(#arrow)"/>

  <rect x="660" y="174" width="360" height="52" rx="6" fill="#EDF2AE" stroke="#666" stroke-width="1.5"/>
  <text x="840" y="196" text-anchor="middle" class="note">Combines both halves into the shared secret,</text>
  <text x="840" y="215" text-anchor="middle" class="note">derives the session keys</text>

  <!-- Server flight -->
  <text x="560" y="254" text-anchor="middle"><tspan class="msg">ServerHello</tspan><tspan class="sub" dx="8">chosen cipher suite, server random,</tspan><tspan class="key" dx="5">+ key share</tspan></text>

  <rect x="320" y="268" width="480" height="108" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="332" y="287" class="tag">encrypted</text>
  <text x="560" y="292" text-anchor="middle"><tspan class="msg">EncryptedExtensions</tspan><tspan class="sub" dx="8">extra settings</tspan></text>
  <text x="560" y="316" text-anchor="middle"><tspan class="msg">Certificate</tspan><tspan class="sub" dx="8">server's certificate</tspan></text>
  <text x="560" y="340" text-anchor="middle"><tspan class="msg">CertificateVerify</tspan><tspan class="sub" dx="8">signature over the handshake</tspan></text>
  <text x="560" y="364" text-anchor="middle"><tspan class="msg">Finished</tspan></text>
  <line x1="840" y1="392" x2="282" y2="392" class="call" marker-end="url(#arrow)"/>

  <rect x="80" y="412" width="400" height="52" rx="6" fill="#EDF2AE" stroke="#666" stroke-width="1.5"/>
  <text x="280" y="434" text-anchor="middle" class="note">Combines both halves into the same secret,</text>
  <text x="280" y="453" text-anchor="middle" class="note">checks the certificate, signature &amp; Finished</text>

  <!-- Client finishes and sends data right away -->
  <text x="560" y="492" text-anchor="middle"><tspan class="msg">Finished</tspan><tspan class="sub" dx="8">(encrypted)</tspan></text>
  <line x1="280" y1="506" x2="838" y2="506" class="call" marker-end="url(#arrow)"/>

  <text x="560" y="538" text-anchor="middle" class="data">Application data (HTTP), encrypted</text>
  <line x1="284" y1="556" x2="836" y2="556" stroke="#2b8a3e" stroke-width="3" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>

  <!-- RTT bracket -->
  <path d="M60,156 H44 V392 H60" stroke="#c92a2a" stroke-width="2" fill="none"/>
  <text transform="translate(30 274) rotate(-90)" text-anchor="middle" class="rtt">1 round trip</text>
</svg>
