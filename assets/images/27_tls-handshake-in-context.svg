<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650">
<defs>
<marker id="a-tcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
<marker id="a-tls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
<marker id="a-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
<style>
text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e1e1e; }
.title { font-size: 20px; font-weight: 700; }
.actor { font-size: 17px; font-weight: 600; }
.lbl { font-size: 13.5px; font-weight: 600; }
.brk { font-size: 13px; font-weight: 600; }
.total { font-size: 17px; font-weight: 700; fill: #c92a2a; }
.legend { font-size: 14px; }
.lifeline { stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 6; }
</style></defs>
<rect width="1080" height="650" fill="#fff"/>
<text x="315.0" y="34" text-anchor="middle" class="title">TLS 1.2 over TCP</text>
<rect x="100" y="52" width="120" height="40" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
<text x="160" y="78" text-anchor="middle" class="actor">Client</text>
<line x1="160" y1="92" x2="160" y2="590" class="lifeline"/>
<rect x="410" y="52" width="120" height="40" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
<text x="470" y="78" text-anchor="middle" class="actor">Server</text>
<line x1="470" y1="92" x2="470" y2="590" class="lifeline"/>
<line x1="160" y1="130" x2="467" y2="185" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a-tcp)"/>
<text transform="translate(313.5 157.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#1971c2">SYN</text>
<line x1="470" y1="185" x2="163" y2="240" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a-tcp)"/>
<text transform="translate(316.5 212.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#1971c2">SYN-ACK</text>
<line x1="160" y1="240" x2="467" y2="295" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(313.5 267.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ACK + ClientHello</text>
<line x1="470" y1="295" x2="163" y2="350" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(316.5 322.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ServerHello, Certificate, Done</text>
<line x1="160" y1="350" x2="467" y2="405" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(313.5 377.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ClientKeyExchange, Finished</text>
<line x1="470" y1="405" x2="163" y2="460" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(316.5 432.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ChangeCipherSpec, Finished</text>
<line x1="160" y1="460" x2="467" y2="515" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#a-http)"/>
<text transform="translate(313.5 487.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#2b8a3e">GET /</text>
<line x1="470" y1="515" x2="163" y2="570" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#a-http)"/>
<text transform="translate(316.5 542.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#2b8a3e">200 OK</text>
<path d="M128,133 H118 V237 H128" stroke="#1971c2" stroke-width="2" fill="none"/>
<text transform="translate(108 185.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#1971c2">TCP</text>
<path d="M128,243 H118 V347 H128" stroke="#e8590c" stroke-width="2" fill="none"/>
<text transform="translate(108 295.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#e8590c">TLS</text>
<path d="M128,353 H118 V457 H128" stroke="#e8590c" stroke-width="2" fill="none"/>
<text transform="translate(108 405.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#e8590c">TLS</text>
<path d="M128,463 H118 V567 H128" stroke="#2b8a3e" stroke-width="2" fill="none"/>
<text transform="translate(108 515.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#2b8a3e">HTTP</text>
<circle cx="160" cy="570" r="6" fill="#c92a2a"/>
<text x="315.0" y="620" text-anchor="middle" class="total">First response after 4 round trips</text>
<text x="855.0" y="34" text-anchor="middle" class="title">TLS 1.3 over TCP</text>
<rect x="640" y="52" width="120" height="40" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
<text x="700" y="78" text-anchor="middle" class="actor">Client</text>
<line x1="700" y1="92" x2="700" y2="590" class="lifeline"/>
<rect x="950" y="52" width="120" height="40" rx="8" fill="#eaeaea" stroke="#1e1e1e" stroke-width="2"/>
<text x="1010" y="78" text-anchor="middle" class="actor">Server</text>
<line x1="1010" y1="92" x2="1010" y2="590" class="lifeline"/>
<line x1="700" y1="130" x2="1007" y2="185" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a-tcp)"/>
<text transform="translate(853.5 157.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#1971c2">SYN</text>
<line x1="1010" y1="185" x2="703" y2="240" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a-tcp)"/>
<text transform="translate(856.5 212.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#1971c2">SYN-ACK</text>
<line x1="700" y1="240" x2="1007" y2="295" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(853.5 267.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ACK + ClientHello + key share</text>
<line x1="1010" y1="295" x2="703" y2="350" stroke="#e8590c" stroke-width="2.5" marker-end="url(#a-tls)"/>
<text transform="translate(856.5 322.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#e8590c">ServerHello … Finished</text>
<line x1="700" y1="350" x2="1007" y2="405" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#a-http)"/>
<text transform="translate(853.5 377.5) rotate(10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#2b8a3e">Finished + GET /</text>
<line x1="1010" y1="405" x2="703" y2="460" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#a-http)"/>
<text transform="translate(856.5 432.5) rotate(-10.16)" y="-8" text-anchor="middle" class="lbl" style="fill:#2b8a3e">200 OK</text>
<path d="M668,133 H658 V237 H668" stroke="#1971c2" stroke-width="2" fill="none"/>
<text transform="translate(648 185.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#1971c2">TCP</text>
<path d="M668,243 H658 V347 H668" stroke="#e8590c" stroke-width="2" fill="none"/>
<text transform="translate(648 295.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#e8590c">TLS</text>
<path d="M668,353 H658 V457 H668" stroke="#2b8a3e" stroke-width="2" fill="none"/>
<text transform="translate(648 405.0) rotate(-90)" text-anchor="middle" class="brk" style="fill:#2b8a3e">HTTP</text>
<circle cx="700" cy="460" r="6" fill="#c92a2a"/>
<text x="855.0" y="620" text-anchor="middle" class="total">First response after 3 round trips</text>
</svg>