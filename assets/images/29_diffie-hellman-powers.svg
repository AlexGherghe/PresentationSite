<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
<style>
text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e1e1e; }
.h { font-size: 20px; font-weight: 700; }
.m { font-size: 22px; font-family: "SF Mono", Menlo, Consolas, monospace; }
.lbl { font-size: 13px; fill: #868e96; }
.share { font-size: 20px; font-weight: 700; font-family: "SF Mono", Menlo, Consolas, monospace; }
.foot { font-size: 15px; fill: #444; }
</style></defs>
<rect width="800" height="460" fill="#fff"/>
<rect x="310" y="18" width="180" height="44" rx="22" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
<text x="400" y="47" text-anchor="middle" class="m" style="font-size:19px">public: g = 5</text>
<rect x="30" y="80" width="300" height="320" rx="10" fill="#fff5f5" stroke="#ffc9c9"/>
<text x="180" y="112" text-anchor="middle" class="h">Client</text>
<rect x="470" y="80" width="300" height="320" rx="10" fill="#e7f5ff" stroke="#a5d8ff"/>
<text x="620" y="112" text-anchor="middle" class="h">Server</text>
<text x="180" y="160" text-anchor="middle" class="m">a = 2</text>
<text x="180" y="181" text-anchor="middle" class="lbl">random secret</text>
<text x="620" y="160" text-anchor="middle" class="m">b = 3</text>
<text x="620" y="181" text-anchor="middle" class="lbl">random secret</text>
<text x="180" y="238" text-anchor="middle" class="m"><tspan>5</tspan><tspan dy="-9" font-size="0.68em">2</tspan><tspan dy="9"></tspan></text>
<text x="180" y="259" text-anchor="middle" class="lbl">key share</text>
<text x="620" y="238" text-anchor="middle" class="m"><tspan>5</tspan><tspan dy="-9" font-size="0.68em">3</tspan><tspan dy="9"></tspan></text>
<text x="620" y="259" text-anchor="middle" class="lbl">key share</text>
<line x1="290" y1="282" x2="510" y2="282" stroke="#e8590c" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="400" y="272" text-anchor="middle" class="share" style="fill:#e8590c"><tspan>5</tspan><tspan dy="-9" font-size="0.68em">2</tspan><tspan dy="9"></tspan></text>
<line x1="510" y1="306" x2="290" y2="306" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="400" y="332" text-anchor="middle" class="share" style="fill:#2f9e44"><tspan>5</tspan><tspan dy="-9" font-size="0.68em">3</tspan><tspan dy="9"></tspan></text>
<rect x="45" y="336" width="270" height="42" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
<text x="180" y="365" text-anchor="middle" class="m" style="font-size:20px"><tspan>(5</tspan><tspan dy="-9" font-size="0.68em">3</tspan><tspan dy="9">)</tspan><tspan dy="-9" font-size="0.68em">2</tspan><tspan dy="9"> = 5</tspan><tspan dy="-9" font-size="0.68em">3×2</tspan><tspan dy="9"> = </tspan><tspan font-weight="700" style="fill:#7048e8">5</tspan><tspan dy="-9" font-size="0.68em" font-weight="700" style="fill:#7048e8">6</tspan><tspan dy="9"></tspan></text>
<text x="180" y="393" text-anchor="middle" class="lbl">shared secret</text>
<rect x="485" y="336" width="270" height="42" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
<text x="620" y="365" text-anchor="middle" class="m" style="font-size:20px"><tspan>(5</tspan><tspan dy="-9" font-size="0.68em">2</tspan><tspan dy="9">)</tspan><tspan dy="-9" font-size="0.68em">3</tspan><tspan dy="9"> = 5</tspan><tspan dy="-9" font-size="0.68em">2×3</tspan><tspan dy="9"> = </tspan><tspan font-weight="700" style="fill:#7048e8">5</tspan><tspan dy="-9" font-size="0.68em" font-weight="700" style="fill:#7048e8">6</tspan><tspan dy="9"></tspan></text>
<text x="620" y="393" text-anchor="middle" class="lbl">shared secret</text>
<text x="400" y="436" text-anchor="middle" class="foot">Both multiply six 5s together, just grouped in a different order.</text>
</svg>