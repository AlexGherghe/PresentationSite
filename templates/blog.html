<!-- Blog Header -->
<header class="page-header">
    <div class="container">
        <h1 class="page-header__title">Articles</h1>
        <p class="page-header__description">{{post_count}} articles, tutorials and deep dives into software engineering.</p>
    </div>
</header>

<!-- Posts -->
<section class="section section--posts" aria-label="All articles">
    <div class="container">
        {{filter}}
        <div class="posts-grid">
            {{posts}}
        </div>
    </div>
</section>
